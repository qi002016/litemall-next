server:
  port: 8007
spring:
  application:
    name: litemall-storage
  config:
    import:
      - optional:nacos:${spring.application.name}.yaml
      # 共享配置：随 litemall-common-core 打包进 classpath（本地机密加载亦由 common.yaml 统一声明）
      - optional:classpath:common.yaml

hm:
  storage:
    # L7：上传目录、单文件大小上限、扩展名白名单全部可配置
    dir: ${HM_STORAGE_DIR:./storage}
    # 默认 10MB；实现内另以 Integer.MAX_VALUE 兜底（DB 列为 int），超限直接拒绝
    max-size: ${HM_STORAGE_MAX_SIZE:10485760}
    allowed-extensions: ${HM_STORAGE_ALLOWED_EXT:jpg,jpeg,png,gif,webp,bmp,pdf}

---
# M12：prod profile 强制连接配置中心（去掉 optional 语义）——Nacos 不可达即启动失败，
# 避免"以为连了配置中心、实际只用本地 yaml"的静默降级。
# 若某生产环境确实不使用 Nacos，请显式覆写 SPRING_CONFIG_IMPORT 并在发布评审中说明。
spring:
  config:
    activate:
      on-profile: prod
    import:
      - nacos:${spring.application.name}.yaml
