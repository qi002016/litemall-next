server:
  port: 8002
  # H3：默认只绑回环；容器/对外部署用 HM_SERVER_BIND 覆盖为 0.0.0.0
  address: ${HM_SERVER_BIND:127.0.0.1}
spring:
  application:
    name: litemall-goods
  profiles:
    active: ${HM_ACTIVE_PROFILE:dev}
  config:
    import:
      - optional:nacos:${spring.application.name}.yaml
      # 本地开发机密：不进 git 的本地文件（换机器只需复制一份，免配环境变量）
      # 推荐放在仓库后端根 backend/litemall-next/application-local.yaml（由 ../ 命中），
      # 也可放各服务自己的目录（./）或 ./config/ 下；文件不存在时静默跳过。
      - optional:file:./application-local.yaml
      - optional:file:./config/application-local.yaml
      - optional:file:../application-local.yaml
  datasource:
    url: jdbc:mysql://${hm.db.host:127.0.0.1}:${hm.db.port:3306}/${hm.db.name:litemall}?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    # M12/H5：账号不再写死 root，由 HM_DB_USER 注入（默认值仍为 root 以保持现有 dev 可跑）
    username: ${HM_DB_USER:root}
    # M12：口令无默认值——dev 由 application-dev.yaml 提供，prod 必须由环境变量 HM_DB_PW 注入
    password: ${hm.db.pw}
  data:
    redis:
      host: ${hm.redis.host:127.0.0.1}
      port: ${hm.redis.port:6379}
      password: ${hm.redis.pw:}
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  cloud:
    nacos:
      # M12：中间件地址由环境变量注入；默认值为本环境的 dev 中间件（实测可达），可整体替换以切换环境
      server-addr: ${HM_NACOS_ADDR:192.168.96.129:8848}
    sentinel:
      enabled: false
      transport:
        dashboard: localhost:8090

mybatis-plus:
  configuration:
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    db-config:
      update-strategy: not_null
      id-type: auto
seata:
  enabled: true
  application-id: ${spring.application.name}
  tx-service-group: default_tx_group
  registry:
    type: nacos
    nacos:
      application: seata-server
      server-addr: ${HM_SEATA_ADDR:192.168.96.129:8848}
      group: SEATA_GROUP
      namespace: ""
      cluster: default
      username: ""
      password: ""
  service:
    vgroup-mapping:
      default_tx_group: default
sentinel:
  enabled: false

logging:
  level:
    # M12：清掉历史遗留的错误命名空间（原 logger 名不属于本项目）
    com.litemall: ${HM_LOG_LEVEL_APP:DEBUG}
  pattern:
    dateformat: HH:mm:ss:SSS
  file:
    path: "logs/${spring.application.name}"

hm:
  # H3：/inner/** 内部调用共享密钥，由环境变量 HM_INTERNAL_TOKEN 注入
  internal:
    token: ${HM_INTERNAL_TOKEN:}

---
# M12：prod profile 强制连接配置中心（去掉 optional 语义）——Nacos 不可达即启动失败，
# 避免"以为连了配置中心、实际只用本地 yaml"的静默降级。
# 若某生产环境确实不使用 Nacos，请显式覆写 SPRING_CONFIG_IMPORT 并在发布评审中说明。
spring:
  config:
    activate:
      on-profile: prod
    import:
      - nacos:${spring.application.name}.yaml
