server:
  port: 8000
spring:
  application:
    name: gateway
  config:
    import:
      - optional:nacos:${spring.application.name}.yaml
      # 共享配置：随 litemall-common-core 打包进 classpath（本地机密加载亦由 common.yaml 统一声明），服务内同名键可覆盖（见 seata.enabled）
      - optional:classpath:common.yaml
  cloud:
    nacos:
      discovery:
        namespace: public
    sentinel:
      filter:
        enabled: false
    gateway:
      server:
        webflux:
          # NF-2：Nacos 客户端带入 io.grpc(仅 shaded netty)，会让 SCG 启用 gRPC 路由能力，
          # 而 GrpcSslConfigurer 需要未 shade 的 io.grpc.netty.NettyChannelBuilder → 网关启动即失败。
          # 本项目不做 gRPC 路由，显式关闭该过滤器。
          filter:
            json-to-grpc:
              enabled: false
          discovery:
            locator:
              enabled: false
              lower-case-service-id: true
          routes:
            - id: user
              uri: lb://litemall-user
              predicates:
                - Path=/app/auth/**,/app/user/**,/app/address/**
            - id: goods
              uri: lb://litemall-goods
              predicates:
                - Path=/app/goods/**,/app/search/**
            - id: order
              uri: lb://litemall-order
              predicates:
                - Path=/app/cart/**,/app/order/**,/app/aftersale/**,/app/collect/**,/app/footprint/**
            - id: marketing
              uri: lb://litemall-marketing
              predicates:
                - Path=/app/market/**
            - id: pay
              uri: lb://litemall-pay
              predicates:
                - Path=/app/pay/**
            - id: message
              uri: lb://litemall-message
              predicates:
                - Path=/app/msg/**,/app/feedback/**
            - id: storage
              uri: lb://litemall-storage
              predicates:
                - Path=/app/storage/**
            - id: storage-file
              uri: lb://litemall-storage
              predicates:
                - Path=/storage/**
            - id: admin
              uri: lb://litemall-admin
              predicates:
                - Path=/admin/**
            # 购物助手是独立 Python 进程：/agent 前缀原样转发，不剥前缀（agent 自身暴露 /agent/**）
            - id: agent
              uri: http://127.0.0.1:8100
              predicates:
                - Path=/agent/**
seata:
  # M16/NF-1：网关不参与分布式事务（公共配置默认 enabled: true，此处显式覆盖为 false）
  enabled: false
hm:
  # H4：密钥库口令不再随源码提交，必须由环境变量注入；缺失时启动失败(fail-fast)
  jwt:
    location: ${HM_JKS_LOCATION:classpath:litemall.jks}
    alias: ${HM_JKS_ALIAS:hmall}
    password: ${HM_JKS_PASSWORD:}
    tokenTTL: 30m
  auth:
    # H1：路径前缀 → 要求的令牌角色与受众
    roleRules:
      - pattern: /admin/**
        role: admin
        aud: litemall-admin
      - pattern: /app/**
        role: user
        aud: litemall-app
      # 会话必须知道"你是谁"：/agent/** 与 /app/** 同角色同受众，且不放进 excludePaths
      - pattern: /agent/**
        role: user
        aud: litemall-app
    excludePaths:
      - /app/auth/login
      - /app/auth/register
      - /app/auth/wx-login
      - /app/auth/captcha
      # 商品浏览（白名单）
      - /app/goods/list
      - /app/goods/detail
      - /app/goods/category
      - /app/goods/brand/list
      - /app/goods/comment/list
      # 营销浏览（白名单）
      - /app/market/ad/list
      - /app/market/coupon/list
      - /app/market/groupon/list
      - /app/market/topic/list
      # 首页轮播"跳专题"从免登录态打开详情，不放行会 401
      - /app/market/topic/detail
      - /app/market/notice/list
      # H2：微信支付回调免登录(微信服务器无令牌)，但必须在 pay 服务内通过验签；
      # 只登记精确路径，禁止通配，避免新增回调端点自动获得免登录语义
      - /app/pay/notify/wechat
      # 管理端登录（白名单）
      - /admin/auth/login

---
# M12：prod profile 强制连接配置中心（去掉 optional 语义）——Nacos 不可达即启动失败，
# 避免"以为连了配置中心、实际只用本地 yaml"的静默降级。
# 若某生产环境确实不使用 Nacos，请显式覆写 SPRING_CONFIG_IMPORT 并在发布评审中说明。
spring:
  config:
    activate:
      on-profile: prod
    import:
      - nacos:${spring.application.name}.yaml
