# M12：本地开发配置（仅 dev profile 生效）。
# 网关是 WebFlux 应用，无数据源/Redis 依赖，本文件仅用于统一"每个服务都有 dev 落点"的 profile 约定。
# 注意：令牌私钥库口令 HM_JKS_PASSWORD 刻意不在此处给默认值（H4），dev 也须由环境变量注入。
logging:
  level:
    com.litemall: DEBUG

# 注册 IP 必须与 server.address 保持一致（H3 配套）：
# dev 默认只绑回环（HM_SERVER_BIND=127.0.0.1），若让 Spring 自动探测注册 IP，会取主机第一块
# 非回环网卡（本机为 VMware VMnet8 的 192.168.96.1）；网关自身的注册地址虽不影响转发，
# 但保持与其它服务一致，避免运维排查时误判。
# 容器/多机：置空 HM_DISCOVERY_IP 即回退为自动探测（docker-compose.yml 已如此设置）。
spring:
  cloud:
    nacos:
      discovery:
        ip: ${HM_DISCOVERY_IP:127.0.0.1}
