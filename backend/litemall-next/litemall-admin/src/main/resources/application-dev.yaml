# M12：本地开发配置（仅 dev profile 生效）。
# 生产不得依赖本文件内的任何口令：prod 下这些占位符必须由环境变量注入（缺失即启动失败）。
# 背景：本模块的 application.yaml 引用了无默认值的 ${hm.db.pw}，此前没有本文件 →
#       占位符不可解析，admin 在 dev 下无法启动，且因该模块原先 0 测试而未被发现。
hm:
  db:
    host: localhost
    port: 3306
    name: litemall
    pw: 123456
  redis:
    host: localhost
    port: 6379

# 注册 IP 必须与 server.address 保持一致（H3 配套）：
# dev 默认只绑回环（HM_SERVER_BIND=127.0.0.1），若让 Spring 自动探测注册 IP，会取主机第一块
# 非回环网卡（本机为 VMware VMnet8 的 192.168.96.1），网关照 Nacos 里的地址转发必然
# Connection refused → 500。此处把 dev 的注册 IP 定为回环，与默认绑定地址一致。
# 容器/多机：置空 HM_DISCOVERY_IP 即回退为自动探测（docker-compose.yml 已如此设置），
# 或显式给出网关可达的 IP。
spring:
  cloud:
    nacos:
      discovery:
        ip: ${HM_DISCOVERY_IP:127.0.0.1}
