server:
  port: 8008
  # H3：默认只绑回环；容器/对外部署用 HM_SERVER_BIND 覆盖为 0.0.0.0
  address: ${HM_SERVER_BIND:127.0.0.1}
spring:
  application:
    name: litemall-admin
  # M12 铺垫：默认 dev（本地/联调），生产必须用 HM_ACTIVE_PROFILE=prod 覆盖，
  # 届时缺 HM_JKS_PASSWORD / HM_INTERNAL_TOKEN 会直接启动失败
  profiles:
    active: ${HM_ACTIVE_PROFILE:dev}
  config:
    import:
      - optional:nacos:${spring.application.name}.yaml
  datasource:
    url: jdbc:mysql://${hm.db.host}:3306/litemall?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${hm.db.pw}
  data:
    redis:
      host: ${hm.redis.host:127.0.0.1}
      port: ${hm.redis.port:6379}
      password: ${hm.redis.pw:}
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  cloud:
    nacos:
      server-addr: 192.168.96.129:8848
    sentinel:
      enabled: false

mybatis-plus:
  configuration:
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    db-config:
      update-strategy: not_null
      id-type: auto

hm:
  # H4：密钥库口令不再随源码提交，必须由环境变量注入；缺失时启动失败(fail-fast)
  jwt:
    location: ${HM_JKS_LOCATION:classpath:litemall.jks}
    alias: ${HM_JKS_ALIAS:hmall}
    password: ${HM_JKS_PASSWORD:}
    tokenTTL: 30m
  # H3：/inner/** 内部调用共享密钥，由环境变量 HM_INTERNAL_TOKEN 注入
  internal:
    token: ${HM_INTERNAL_TOKEN:}

logging:
  level:
    com.litemall: debug
  pattern:
    dateformat: HH:mm:ss:SSS
  file:
    path: "logs/${spring.application.name}"
