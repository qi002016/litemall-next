server:
  port: 8004
spring:
  application:
    name: litemall-order
  config:
    import:
      - optional:nacos:${spring.application.name}.yaml
      # 共享配置：随 litemall-common-core 打包进 classpath（本地机密加载亦由 common.yaml 统一声明）
      - optional:classpath:common.yaml

# R4-MQ：订单超时关单（延时消息 + 兜底扫描）。地址与 marketing 一致，由 HM_ROCKETMQ_ADDR 注入。
rocketmq:
  name-server: ${HM_ROCKETMQ_ADDR:192.168.96.129:9876}
  producer:
    group: litemall-order-producer-group
    send-message-timeout: 3000
    retry-times-when-send-failed: 2

hm:
  order:
    # 未付款保留时长（分钟），同时决定 expire_time 与延时消息等级
    expire-minutes: ${HM_ORDER_EXPIRE_MINUTES:30}
    timeout-mq:
      # false = 完全不投递延时消息，退化为纯兜底扫描
      enabled: ${HM_ORDER_TIMEOUT_MQ_ENABLED:true}
    timeout-scan:
      # false = 关闭内置兜底扫描（改用外部调度统一打 CN-11）
      enabled: ${HM_ORDER_TIMEOUT_SCAN_ENABLED:true}
      initial-ms: ${HM_ORDER_TIMEOUT_SCAN_INITIAL_MS:60000}
      # 扫描周期，默认 5 分钟
      ms: ${HM_ORDER_TIMEOUT_SCAN_MS:300000}

---
# M12：prod profile 强制连接配置中心（去掉 optional 语义）——Nacos 不可达即启动失败，
# 避免"以为连了配置中心、实际只用本地 yaml"的静默降级。
# 若某生产环境确实不使用 Nacos，请显式覆写 SPRING_CONFIG_IMPORT 并在发布评审中说明。
spring:
  config:
    activate:
      on-profile: prod
    import:
      - nacos:${spring.application.name}.yaml
