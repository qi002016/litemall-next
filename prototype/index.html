<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>小满商城 · 交互原型</title>
  <meta name="description" content="小满商城交互原型：单 SPA、纯静态零依赖，手机端 17 屏 + 后台 10 屏，数据全部来自本机 localStorage。" />
  <link rel="stylesheet" href="assets/theme.css" />
  <style>
    /* ------------------------------------------------------------------
       原型外壳补充样式（只补 theme.css 没有的辅助类，不覆盖既有设计系统）
       ------------------------------------------------------------------ */
    html, body { margin: 0; padding: 0; }
    * { box-sizing: border-box; }
    #root { min-height: 100vh; }

    /* 商品详情的价格条是橙色渐变底，价格需要白字（theme.css 里 .price 默认红字） */
    .detail-price .price,
    .detail-price .price .sym { color: #fff; }

    /* 键值行：商品参数、订单信息等 */
    .x-kv {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 12px; padding: 8px 0; font-size: 12.5px;
      border-bottom: 1px dashed var(--line);
    }
    .x-kv:last-child { border-bottom: 0; }
    .x-kv .k { color: var(--text-3); flex: none; }
    .x-kv .v { text-align: right; min-width: 0; word-break: break-word; }
    .x-hr { height: 1px; background: var(--line); margin: 10px 0; }

    /* 列表页筛选控件 */
    .x-price-in {
      flex: 1; min-width: 0; height: 32px; padding: 0 8px;
      border: 1px solid var(--line-2); border-radius: 8px;
      background: #fff; color: var(--text); font-size: 12.5px; outline: none;
    }
    .x-price-in:focus { border-color: var(--brand); }
    .x-sel {
      width: 100%; height: 34px; padding: 0 8px;
      border: 1px solid var(--line-2); border-radius: 8px;
      background: #fff; color: var(--text); font-size: 12.5px;
    }

    /* 分类页左右两栏 */
    .x-cat-left { width: 88px; flex: none; background: #fff; border-right: 1px solid var(--line); }
    .x-cat-item {
      padding: 14px 6px; text-align: center; font-size: 12.5px;
      color: var(--text-2); cursor: pointer; transition: .15s;
    }
    .x-cat-item.on {
      background: var(--bg); color: var(--brand); font-weight: 700;
      box-shadow: inset 3px 0 0 var(--brand);
    }
    .x-cat-right { flex: 1; min-width: 0; padding: 12px; }
    .x-sub { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .x-sub .it {
      background: #fff; border-radius: 10px; padding: 12px 6px;
      text-align: center; font-size: 12px; cursor: pointer;
      box-shadow: var(--shadow);
    }
    .x-sub .it .e { display: block; font-size: 22px; margin-bottom: 6px; }

    /* 手机壳内绝不出横向滚动条 */
    .phone .c-page, .phone .c-body { max-width: 100%; overflow-x: hidden; }
    .admin-body { min-width: 0; }

    /* 初始占位（脚本接管后会被替换） */
    .boot-placeholder {
      min-height: 100vh; display: grid; place-items: center;
      color: #8a9100; color: var(--text-3); font: 14px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="boot-placeholder">小满商城 · 交互原型加载中…（若长时间停留在此页，请检查 assets/ 下的脚本是否存在）</div>
  </div>

  <!-- 数据层：全部业务规则（只读，禁止改） -->
  <script src="assets/store.js"></script>
  <!-- 片段工厂 / 格式化 / toast / sheet（只读，禁止改） -->
  <script src="assets/ui.js"></script>
  <!-- 后台 10 屏：由 proto-admin 维护，注册 window.ADMIN_ROUTES -->
  <script src="assets/admin-screens.js"></script>
  <!-- SPA 外壳 + 手机端 17 屏：注册 window.C_ROUTES，末尾启动路由 -->
  <script src="assets/app.js"></script>
</body>
</html>
